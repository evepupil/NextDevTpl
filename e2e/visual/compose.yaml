# 截图基线专用 PostgreSQL。
#
# 账号、库名、端口必须和 constants.ts 里的 VISUAL_DB 保持一致。
# 数据放进 Docker 命名卷，不挂载到 NTFS 项目目录；每次截图都会清空并重建表，
# 所以卷里只是个临时库，随时可以删除。
name: nextdevtpl-visual

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nextdevtpl_visual
      POSTGRES_PASSWORD: nextdevtpl-visual
      POSTGRES_USER: nextdevtpl
    # 只监听本机回环地址，避免把截图库暴露到局域网。
    ports:
      - "127.0.0.1:15470:5432"
    # 临时库不需要落盘可靠性，关掉同步写盘让清库、迁移、写种子更快。
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextdevtpl -d nextdevtpl_visual"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: nextdevtpl_visual_pg
